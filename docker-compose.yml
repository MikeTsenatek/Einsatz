services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend

  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/workspace:cached
      - frontend_node_modules:/workspace/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - app

  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.13-bookworm
    working_dir: /workspace
    command: >-
      sh -c "pip install --user --no-cache-dir -r requirements.txt
      && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/workspace:cached
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,app
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      POSTGRES_DB: einsatzleitsoftware
      POSTGRES_USER: einsatzleitsoftware
      POSTGRES_PASSWORD: einsatzleitsoftware
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_REQUIRED_GROUP: ${KEYCLOAK_REQUIRED_GROUP:-}
      KEYCLOAK_GROUPS_CLAIM: ${KEYCLOAK_GROUPS_CLAIM:-groups}
      KEYCLOAK_GROUPS_SCOPE: ${KEYCLOAK_GROUPS_SCOPE-groups}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: einsatzleitsoftware
      POSTGRES_USER: einsatzleitsoftware
      POSTGRES_PASSWORD: einsatzleitsoftware
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U einsatzleitsoftware -d einsatzleitsoftware"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  frontend_node_modules:
  postgres_data:
  redis_data:
